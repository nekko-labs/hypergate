<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="1" stop-color="#0b0d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#6d5efc" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="600" fill="url(#bg)"/>
  <!-- starfield -->
  <g fill="#e6ecff">
    <circle cx="90" cy="60" r="1.4" opacity="0.7"/><circle cx="240" cy="500" r="1.1" opacity="0.5"/>
    <circle cx="410" cy="90" r="1" opacity="0.45"/><circle cx="560" cy="540" r="1.3" opacity="0.6"/>
    <circle cx="700" cy="70" r="1.2" opacity="0.55"/><circle cx="860" cy="520" r="1" opacity="0.4"/>
    <circle cx="1010" cy="90" r="1.5" opacity="0.7"/><circle cx="1150" cy="470" r="1.1" opacity="0.5"/>
    <circle cx="1230" cy="180" r="1.2" opacity="0.6"/><circle cx="180" cy="300" r="1" opacity="0.35"/>
    <circle cx="640" cy="320" r="1" opacity="0.3"/><circle cx="960" cy="380" r="1" opacity="0.35"/>
    <circle cx="1120" cy="60" r="0.9" opacity="0.4"/><circle cx="340" cy="420" r="0.9" opacity="0.4"/>
  </g>
  <rect width="1280" height="600" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- left: wordmark + tagline -->
  <g transform="translate(84, 150)">
    <g transform="translate(0,-26)">
      <circle cx="16" cy="16" r="13" fill="none" stroke="url(#accent)" stroke-width="4.5"/>
      <circle cx="16" cy="16" r="6" fill="url(#core)"/>
    </g>
    <text x="52" y="0" font-size="28" font-weight="700" fill="#8a93b8" letter-spacing="4">HYPERGATE</text>
    <text x="-4" y="118" font-size="88" font-weight="800" letter-spacing="-2" fill="#f2f5ff">Every MCP server.<tspan x="-2" dy="0"></tspan></text>
    <text x="-4" y="212" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#accent)">One gate.</text>
    <text x="2" y="272" font-size="21" fill="#aab3d6">Run MCP servers securely on your machine — sandboxed, supervised, aggregated —</text>
    <text x="2" y="302" font-size="21" fill="#aab3d6">and jump any agent through a single gateway endpoint.</text>

    <g transform="translate(0, 344)" font-size="17" font-weight="600">
      <g>
        <rect x="0" y="0" width="140" height="40" rx="20" fill="#10132a" stroke="#232a4d"/>
        <text x="70" y="26" text-anchor="middle" fill="#22d3ee">local-first</text>
      </g>
      <g transform="translate(156,0)">
        <rect x="0" y="0" width="248" height="40" rx="20" fill="#10132a" stroke="#232a4d"/>
        <text x="124" y="26" text-anchor="middle" fill="#8f83ff">process or Docker isolation</text>
      </g>
      <g transform="translate(420,0)">
        <rect x="0" y="0" width="92" height="40" rx="20" fill="#10132a" stroke="#232a4d"/>
        <text x="46" y="26" text-anchor="middle" fill="#45d99a">MIT</text>
      </g>
    </g>
  </g>

  <!-- right: servers → the gate → agents motif -->
  <g transform="translate(760, 132)" filter="url(#soft)">
    <!-- managed servers -->
    <g font-size="15" fill="#dfe5ff" text-anchor="middle">
      <g transform="translate(0,0)"><rect width="118" height="50" rx="12" fill="#0e1126" stroke="#26305c"/><text x="59" y="30">filesystem</text></g>
      <g transform="translate(0,78)"><rect width="118" height="50" rx="12" fill="#0e1126" stroke="#26305c"/><text x="59" y="30">github</text></g>
      <g transform="translate(0,156)"><rect width="118" height="50" rx="12" fill="#0e1126" stroke="#26305c"/><text x="59" y="30">postgres</text></g>
      <g transform="translate(0,234)"><rect width="118" height="50" rx="12" fill="#0e1126" stroke="#26305c"/><text x="59" y="30">context7</text></g>
    </g>

    <!-- streams bending into the gate -->
    <g stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M118 25 C 190 25, 210 142, 262 142"/>
      <path d="M118 103 C 185 103, 205 142, 262 142"/>
      <path d="M118 181 C 185 181, 205 142, 262 142"/>
      <path d="M118 259 C 190 259, 210 142, 262 142"/>
    </g>

    <!-- the gate: a warp ring -->
    <g transform="translate(316,142)">
      <circle r="54" fill="none" stroke="url(#accent)" stroke-width="10"/>
      <circle r="26" fill="url(#core)"/>
    </g>

    <!-- gate → agent -->
    <path d="M372 142 C 400 142, 402 142, 428 142" stroke="#dfe5ff" stroke-opacity="0.55" stroke-width="2.5" fill="none"/>

    <!-- agent -->
    <g transform="translate(428,110)">
      <rect width="122" height="64" rx="14" fill="#0e1126" stroke="#26305c"/>
      <text x="61" y="30" text-anchor="middle" font-size="15" fill="#dfe5ff">your agent</text>
      <text x="61" y="50" text-anchor="middle" font-size="13" fill="#8a93b8">one endpoint</text>
    </g>
  </g>
</svg>
