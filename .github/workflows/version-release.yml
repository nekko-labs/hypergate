name: Release on version bump

# Ships a release whenever a merge to main changes the version in package.json,
# so cutting one is part of the PR that earned it rather than a manual tag
# afterwards. Bump the version (and write its notes), merge, and the installers
# appear.
#
# Why this tags *and* dispatches, rather than just tagging: a tag pushed with
# GITHUB_TOKEN does not trigger other workflows (GitHub blocks that to prevent
# recursion), so release.yml would never fire. Dispatching it explicitly at the
# new tag is what makes it work without a personal access token, and `--ref
# <tag>` means that run sees the tag as `github.ref_name`, exactly as it would
# from a hand-pushed tag.

on:
  # A human merge fires this immediately.
  push:
    branches: [main]
    paths:
      - 'package.json'
  # ...but a merge performed by a bot does not: a push made with GITHUB_TOKEN
  # never starts a workflow run (the same recursion guard that stops a
  # bot-pushed tag from triggering release.yml). Merges here are human today, so
  # the push above is the fast path, but kotrain's are not and its release was
  # silently skipped because of exactly this. So a schedule is the backstop: it
  # notices an untagged version bump whoever merged it. Everything below is
  # idempotent (it stops once the tag exists), so overlapping triggers are safe.
  schedule:
    - cron: '*/15 * * * *'
  # Cut a pending release right now instead of waiting for the tick.
  workflow_dispatch:

concurrency:
  # Two ticks (or a tick and a push) must not race to create the same tag.
  group: version-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version '$version' is not a release version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: check
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A push that touches package.json without changing the version (a
          # dependency bump, a script edit) lands here too, so the tag is the
          # thing that decides whether there is a release to cut.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the release is actually ready to cut
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          # The version lives in seven files (TASKS.md §4.1) and the repo already
          # owns the assertion, so use it rather than re-implementing part of it.
          # It needs no dependencies, only Node built-ins, so no install first.
          if ! node scripts/bump-version.mjs --check; then
            status=1
          fi
          # release.yml takes its notes from docs/releases/<version>.md and fails
          # without it. Checking here means a missing notes file stops the run
          # *before* a tag exists, rather than leaving a tag pointing at a
          # release that never built. See docs/releases/README.md.
          if [ ! -f "docs/releases/$VERSION.md" ]; then
            echo "docs/releases/$VERSION.md is missing; write the notes in the same PR as the bump." >&2
            status=1
          fi
          exit $status

      - name: Tag it
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Build the installers and publish the release
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          echo "Dispatched release.yml at $TAG."
          echo "Watch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
