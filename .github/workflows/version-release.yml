name: Start a release line

# The manual MAJOR.MINOR bump. A person starts a new line by pushing the short
# tag `vMAJOR.MINOR` (or creating a GitHub release with it): this adds
# `vMAJOR.MINOR.0` on the same commit and releases it. Every nightly after that
# is the next patch on the line (nightly-release.yml, scripts/nightly-version.mjs).
# Nothing else moves MAJOR or MINOR: PRs no longer bump the version (TASKS.md §4.1).
#
#   git tag -a v1.39 -m v1.39 origin/main && git push origin v1.39
#
# A full `vX.Y.Z` tag pushed by a person starts release.yml on its own.
#
# Earlier this released whenever a merge to main changed package.json's version,
# which made every PR bump the minor and queue behind the others for the next
# number.
#
# Why this tags *and* dispatches: a tag pushed with GITHUB_TOKEN starts no other
# workflow (GitHub's recursion guard), so release.yml would never fire on the tag
# alone. `--ref <tag>` means that run sees the tag as `github.ref_name`.

on:
  push:
    tags:
      # The short form only; release.yml takes the full one.
      - 'v[0-9]+.[0-9]+'
  # Re-run for a short tag by hand: gh workflow run version-release.yml -f tag=v1.39
  workflow_dispatch:
    inputs:
      tag:
        description: The short tag that starts the line (vMAJOR.MINOR)
        required: true

concurrency:
  # Shared with nightly-release.yml: two triggers must not race to create a tag.
  group: version-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - name: Work out the release tag
        id: version
        shell: bash
        env:
          SHORT: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$SHORT" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "$SHORT is not a short release tag (vMAJOR.MINOR)." >&2
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$SHORT^{commit}" >/dev/null || { echo "No tag $SHORT." >&2; exit 1; }
          echo "tag=$SHORT.0" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "$SHORT^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Skip if it is already tagged
        id: check
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Idempotent: a re-run, or someone who pushed both v1.39 and v1.39.0,
          # releases once (a hand-pushed v1.39.0 already started release.yml).
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag it
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"

      - name: Build the installers and publish the release
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          echo "Dispatched release.yml at $TAG."
          echo "Watch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
