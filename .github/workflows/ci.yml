name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: daemon + core (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor for the durable store (`node:sqlite`); 24 is what most
        # people will actually run it on.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The seams unit tests can't reach: a real daemon, a real MCP round trip
      # over HTTP, and the management API end to end.
      - run: npm run smoke:http
      - run: npm run smoke:features

  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell
      # tray-icon draws through GTK on Linux and needs libxdo for its menu.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - run: cargo fmt --manifest-path apps/shell/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/shell/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/shell/Cargo.toml
      # The macOS packaging renderer is a deliberate JS copy of icon.rs with a
      # literal drift guard. Running it here makes an icon.rs change fail the
      # PR that makes it, instead of the release job two days later (Epic 48:
      # v1.6.0 and v1.7.0 both tagged and never published because only the
      # release workflow ever executed this script).
      - if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: runner.os == 'macOS'
        run: node scripts/gen-icns.mjs "$RUNNER_TEMP/ci-guard.icns"

  standalone:
    name: standalone daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Daemon only: this guards the Node SEA build, which breaks on anything
      # the CommonJS bundle cannot express (a top-level await, say). No cargo
      # build needed for that, so it stays cheap.
      - run: node scripts/build-standalone.mjs --skip-build --daemon-only
      - run: npm run smoke:standalone

  packaging:
    name: packaged install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      # Proves what a user actually gets: assemble the npm packages, install the
      # tarballs into a clean prefix, and drive the installed CLI.
      - run: npm run build:npm
      - run: npm run smoke:install
      # Updating needs the same packaged output (channel detection reads the
      # node_modules layout), so it rides along here rather than paying for a
      # second cargo build.
      - run: npm run smoke:update
