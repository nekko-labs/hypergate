name: Build artifacts

# Every downloadable Hypergate build, for all five platform/architecture pairs:
#
#   shell-<platform>      the bare `hypergate` binary the npm packages wrap
#   installer-<platform>  the native installer, for machines with no Node
#
# Called by the release workflow, and runnable on its own so an installer can be
# built and tested without cutting a release.
on:
  workflow_call:
    inputs:
      require_macos_signing:
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Signing is strictly additive: when no signing secrets are configured every
    # signing step below is skipped and the build ships unsigned, exactly as
    # before. The env indirection exists because `secrets` cannot be read in a
    # step-level `if`. Secret names and setup steps: docs/signing.md.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      MACOS_SIGNING_CERTS_P12: ${{ secrets.MACOS_SIGNING_CERTS_P12 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win32-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: win32-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          # macOS is Apple silicon only: `macos-13` (the last Intel runner) is
          # retired, so an Intel build would have to be cross-compiled and can
          # never be run — not by its own build job, and not by the notarisation
          # or smoke steps that follow it.
          - { name: darwin-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: linux-x64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          REQUIRE_MACOS_SIGNING: ${{ inputs.require_macos_signing }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          names=(
            MACOS_SIGNING_CERTS_P12
            MACOS_CERT_PASSWORD
            MACOS_SIGN_IDENTITY
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
          )
          missing=()
          configured=0
          for name in "${names[@]}"; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done
          if { [ "$REQUIRE_MACOS_SIGNING" = "true" ] || [ "$configured" -gt 0 ]; } \
            && [ "${#missing[@]}" -gt 0 ]; then
            printf 'macOS signing configuration is incomplete. Missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev rpm

      - name: Ensure NSIS is available
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          fi

      - run: npm ci
      - run: npm run build
      - run: cargo build --release --target ${{ matrix.target }} --manifest-path apps/shell/Cargo.toml

      # ── Signing, part 1: the shell binary, so the bare-binary artifact is
      # signed too, not just the installer. ─────────────────────────────────────
      - name: Sign the shell binary (Windows)
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: apps/shell/target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Import the signing certificates (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTS_P12 != ''
        env:
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$MACOS_SIGNING_CERTS_P12" | base64 -d > /tmp/certs.p12
          security import /tmp/certs.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm /tmp/certs.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" build.keychain > /dev/null

      - name: Sign the shell binary (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTS_P12 != ''
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "apps/shell/target/${{ matrix.target }}/release/hypergate"

      - uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.name }}
          path: |
            apps/shell/target/${{ matrix.target }}/release/hypergate
            apps/shell/target/${{ matrix.target }}/release/hypergate.exe
          if-no-files-found: error

      # `--skip-build` reuses the workspace and cargo output above. The shell
      # path is explicit because a target triple puts the binary somewhere other
      # than target/release. Every matrix entry now builds for the runner's own
      # architecture, so the SEA takes the runner's Node as its base.
      - name: Build the standalone payload
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          node scripts/build-standalone.mjs --skip-build \
            --shell "apps/shell/target/${{ matrix.target }}/release/hypergate$exe"

      # ── Signing, part 2: hypergated is minted by the SEA build above, so it
      # can only be signed now. (The shell copy in the payload is already
      # signed; Windows re-signs it harmlessly.) ────────────────────────────────
      - name: Sign the daemon binary (Windows)
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist-standalone
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the daemon binary (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTS_P12 != ''
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          # Node/V8 needs these entitlements to reserve and populate its JIT code range.
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            --entitlements packaging/installers/macos/hypergate-daemon.entitlements.plist \
            dist-standalone/hypergated

      - name: Sign the shell binary in the payload (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTS_P12 != ''
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            dist-standalone/hypergate

      - name: Free native build intermediates before packaging (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          target="apps/shell/target/${{ matrix.target }}"
          echo "Disk space and native target size before cleanup:"
          df -h .
          du -sh "$target"
          rm -rf "$target"
          echo "Disk space after native target cleanup:"
          df -h .

      # The macOS application identity flows into build-dmg.sh, which signs the
      # app bundle and disk image when it is set.
      - name: Build the installer
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          HYPERGATE_BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/build-installers.mjs --skip-payload

      # ── Signing, part 3: the installers themselves. ──────────────────────────
      - name: Sign the installer (Windows)
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist-installers
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Notarize, staple, and verify the installer (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary-api-key.p8"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          dmg=$(ls dist-installers/*.dmg)
          xcrun notarytool submit "$dmg" --key "$key" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --verbose=4 "$dmg"
          spctl --assess --type open --verbose=4 \
            --context context:primary-signature "$dmg"

      # The installer is only worth shipping if the daemon inside it runs.
      # Runs after signing on purpose: a signature that breaks the binary
      # (hardened runtime, SEA quirks) should fail here, not on a user machine.
      - name: Check the standalone daemon runs
        shell: bash
        env:
          HYPERGATE_TARGET_ARCH: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "${MACOS_SIGNING_CERTS_P12:-}" ]; then
            export HYPERGATE_MACOS_DMG="$(ls dist-installers/*.dmg)"
            export HYPERGATE_MACOS_GATEKEEPER=1
          fi
          npm run smoke:standalone

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: dist-installers/*
          if-no-files-found: error
