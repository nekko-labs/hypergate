name: Release

# Cut a release by tagging: `git tag v0.9.0 && git push --tags`.
# The tag must match the version in package.json, which the publish job checks.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  # Every binary and installer, for all six platform/architecture pairs. Shared
  # with the on-demand build so a release and a test build are the same thing.
  build:
    uses: ./.github/workflows/build-artifacts.yml

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the npm packages
        run: |
          set -euo pipefail
          for name in win32-x64 win32-arm64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            binary=$(find "artifacts/shell-$name" -type f \( -name 'hypergate' -o -name 'hypergate.exe' \) | head -1)
            [ -n "$binary" ] || { echo "no binary for $name" >&2; exit 1; }
            chmod +x "$binary"
            node scripts/build-npm.mjs --shell-only --target "$name" --binary "$binary"
          done
          node scripts/build-npm.mjs --skip-build --no-shell

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Platform packages first: the main package lists them as optional
          # dependencies at an exact version, and publishing it first would
          # briefly point users at versions that don't exist yet.
          for dir in dist-npm/hypergate-shell-*/; do
            npm publish "$dir" --access public --provenance
          done
          npm publish dist-npm/hypergated --access public --provenance

      - name: Attach the installers and binaries to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Installers keep the names their build scripts chose; those already
          # carry the version, platform and architecture.
          find artifacts -path '*/installer-*/*' -type f -exec cp {} release-assets/ \;
          # The bare binaries, for anyone scripting an install themselves.
          for name in win32-x64 win32-arm64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            binary=$(find "artifacts/shell-$name" -type f | head -1)
            case "$name" in
              win32-*) cp "$binary" "release-assets/hypergate-$name.exe" ;;
              *) cp "$binary" "release-assets/hypergate-$name" ;;
            esac
          done
          ls -la release-assets
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Install with an installer below (no Node needed), or \`npm install -g hypergated\`. Bare \`hypergate\` CLI binaries are attached too." \
            || gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
