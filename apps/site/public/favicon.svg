<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hypergate">
  <defs>
    <linearGradient id="hgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="hgCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- deep space tile -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0b0d1a"/>
  <!-- the gate: a bold gradient ring -->
  <circle cx="50" cy="50" r="27" fill="none" stroke="url(#hgG)" stroke-width="9"/>
  <!-- warp core glow at the center -->
  <circle cx="50" cy="50" r="14" fill="url(#hgCore)"/>
  <!-- entry streaks: motion through the gate -->
  <g stroke="url(#hgG)" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="9" x2="50" y2="17"/>
    <line x1="50" y1="83" x2="50" y2="91"/>
  </g>
</svg>
